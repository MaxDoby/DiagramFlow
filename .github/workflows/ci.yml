name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: diagramflow_test
          POSTGRES_USER: diagramflow
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U diagramflow -d diagramflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply test database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: 'postgresql://diagramflow:ci_test_only@localhost:5432/diagramflow_test?schema=public'

      - name: Typecheck API and web
        run: |
          npx tsc --noEmit -p apps/api/tsconfig.app.json
          npx tsc --noEmit -p apps/web/tsconfig.app.json

      - name: Lint, test and build
        run: npx nx run-many -t lint test build --parallel=2 --skip-nx-cache
        env:
          CI: 'true'
          NX_DAEMON: 'false'
          DIAGRAMFLOW_TEST_DATABASE_URL: 'postgresql://diagramflow:ci_test_only@localhost:5432/diagramflow_test?schema=public'
